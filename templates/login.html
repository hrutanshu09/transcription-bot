<!DOCTYPE html>
<html>
<head>
  <title>Supervisor Login</title>
</head>
<body>
  <h2>Login</h2>
  {% if error %}
    <p style="color:red;">{{ error }}</p>
  {% endif %}
  <form method="post">
    Phone (WhatsApp format):<br>
    <input type="text" name="phone" required><br><br>
    Password:<br>
    <input type="password" name="password" required><br><br>
    <button type="submit">Login</button>
  </form>
</body>
</html>
