<!DOCTYPE html>
<html>
<head>
  <title>Supervisor Dashboard</title>
</head>
<body>
  <h2>Pending Reports</h2>

  <form method="get">
    Search: <input type="text" name="query" value="{{ query }}">
    Sort by:
    <select name="sort_by">
      <option value="account_number" {% if sort_by == 'account_number' %}selected{% endif %}>Account Number</option>
      <option value="comm_id" {% if sort_by == 'comm_id' %}selected{% endif %}>Report ID</option>
    </select>
    <button type="submit">Filter</button>
  </form>

  {% if reports %}
    {% for r in reports %}
      <hr>
      <strong>Report ID:</strong> {{ r.comm_id }}<br>
      <strong>Account:</strong> {{ r.account_number }}<br>
      <strong>Summary:</strong><br>
      <pre>{{ r.summary_report }}</pre>
      <form method="post" action="{{ url_for('submit_decision', comm_id=r.comm_id) }}">
        <textarea name="decision" required placeholder="Write your decision..."></textarea><br>
        <button type="submit">Submit Decision</button>
      </form>
    {% endfor %}
  {% else %}
    <p>No reports found.</p>
  {% endif %}

  <hr>
  <a href="{{ url_for('logout') }}">Logout</a>
</body>
</html>
